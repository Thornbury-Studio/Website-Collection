<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="AURIS horizontal spatial-audio site preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="55%" stop-color="#07122a"/>
      <stop offset="100%" stop-color="#0a1a36"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <circle cx="90" cy="60" r="90" fill="#38bdf8" opacity="0.18" filter="url(#blur)"/>
  <circle cx="400" cy="240" r="100" fill="#67e8f9" opacity="0.12" filter="url(#blur)"/>
  <g opacity="0.2" stroke="#94c8ff" stroke-width="1">
    <path d="M0 220 H480 M0 240 H480 M0 260 H480"/>
    <path d="M80 180 V300 M140 180 V300 M200 180 V300 M260 180 V300"/>
  </g>
  <ellipse cx="390" cy="250" rx="70" ry="110" fill="#0b1730"/>
  <ellipse cx="390" cy="250" rx="70" ry="110" fill="none" stroke="#67e8f9" stroke-opacity="0.35" stroke-width="2"/>
  <g transform="translate(168 78)">
    <rect x="0" y="20" width="52" height="78" rx="10" fill="url(#glass)" stroke="#dceeff" stroke-opacity="0.35" transform="rotate(-16 26 59)"/>
    <rect x="48" y="8" width="58" height="90" rx="11" fill="url(#glass)" stroke="#dceeff" stroke-opacity="0.45"/>
    <rect x="104" y="24" width="52" height="78" rx="10" fill="url(#glass)" stroke="#dceeff" stroke-opacity="0.35" transform="rotate(14 130 63)"/>
  </g>
  <text x="240" y="168" text-anchor="middle" font-family="Syne, Avenir Next, sans-serif" font-size="64" font-weight="800" fill="url(#word)" letter-spacing="4">AURIS</text>
  <text x="240" y="198" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="13" fill="#b6c7df">Spatial sound · sideways scroll</text>
</svg>

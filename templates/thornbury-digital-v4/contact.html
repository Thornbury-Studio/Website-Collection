<body>
<a class="skip" href="#main">Skip to content</a>
<div class="site">
  <header class="bar glass">
    <a class="mark" href="index.html">Thornbury</a>
    <nav class="nav" aria-label="Primary">
      <a href="work.html">Work</a>
      <a href="studio.html">Studio</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
  <main id="main" class="page" tabindex="-1">
    <h1>Start a project</h1>
    <p class="lede">Tell us what you sell and when you need it.</p>
    <form class="brief" id="brief" action="contact.html" method="post" autocomplete="on">
      <div class="fld">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required autocomplete="name" maxlength="120" enterkeyhint="next">
      </div>
      <div class="fld">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" inputmode="email" enterkeyhint="next">
      </div>
      <div class="fld">
        <label for="message">What you need</label>
        <textarea id="message" name="message" required maxlength="4000" enterkeyhint="send"></textarea>
      </div>
      <button class="send" type="submit">Send</button>
    </form>
    <p class="note" id="brief-note" hidden tabindex="-1">Sent. We’ll answer within one working day.</p>
  </main>
  <footer class="foot">
    <p>Singapore</p>
    <p><a href="mailto:hello@thornbury.studio">hello@thornbury.studio</a></p>
  </footer>
</div>
</body>

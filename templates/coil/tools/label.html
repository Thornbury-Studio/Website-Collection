<!doctype html>
<!-- COIL tin label, rendered flat by tools/tin.py (headless Chrome, 2x) and then
     wrapped onto the photographed tin. 2100 x 540 CSS px = the arc of the tin
     that faces the camera (±80°); the print sits in the middle ±40°. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: Anybody; src: url(../fonts/anybody-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 50% 150%; }
  @font-face { font-family: Newsreader; src: url(../fonts/newsreader-latin.woff2) format("woff2"); font-weight: 200 800; }
  html, body { margin: 0; }
  body { width: 2100px; height: 540px; background: #f6f5ef; color: #22231a; overflow: hidden; }
  .label { position: relative; width: 100%; height: 100%; }
  .edge { position: absolute; left: 0; right: 0; height: 3px; background: #22231a; }
  .edge.top { top: 26px; } .edge.bot { bottom: 26px; }
  .front { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 820px; }
  .cups { display: flex; justify-content: center; gap: 13px; margin-bottom: 18px; }
  .cups i { width: 22px; height: 22px; border-radius: 50%; }
  .cups i:nth-child(1) { background: #e0d98f; } .cups i:nth-child(2) { background: #cfc354; }
  .cups i:nth-child(3) { background: #c9bc5a; } .cups i:nth-child(4) { background: #d9d190; }
  .cups i:nth-child(5) { background: #e8e4bd; box-shadow: inset 0 0 0 1.5px #b9b28a; }
  .word { font-family: Anybody; font-stretch: 50%; font-weight: 780; font-size: 230px; line-height: .8; letter-spacing: .035em; margin: 0; }
  .what { font-family: Newsreader; font-size: 25px; line-height: 1.3; margin: 20px 0 0; letter-spacing: .01em; }
  .what b { font-family: Anybody; font-stretch: 100%; font-weight: 600; font-size: 18px; letter-spacing: .06em; }
  .side { position: absolute; top: 50%; transform: translateY(-50%); font-family: Anybody; font-stretch: 100%; font-weight: 500; font-size: 17px; line-height: 1.5; letter-spacing: .04em; }
  .side.l { left: 470px; text-align: right; } .side.r { right: 470px; }
</style>
<div class="label">
  <div class="edge top"></div>
  <div class="side l">Jin Xuan<br>TTES No. 12</div>
  <div class="front">
    <div class="cups"><i></i><i></i><i></i><i></i><i></i></div>
    <p class="word">COIL</p>
    <p class="what">High-mountain oolong, rolled whole<br>Lugu, Nantou, Taiwan &#8201;1,000 m</p>
  </div>
  <div class="side r">Spring 2026<br>75 g</div>
  <div class="edge bot"></div>
</div>

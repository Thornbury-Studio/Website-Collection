<main class="entry-hero">
  <div class="entry-stage" id="stage">
    <img id="stageImg" src="img/e-continental-1600.webp"
         srcset="img/e-continental-800.webp 800w, img/e-continental-1600.webp 1600w, img/e-continental-2560.webp 2560w"
         sizes="100vw" width="6656" height="3744"
         alt="A black grand touring coupé in a black studio, one sweep of light along its body"
         fetchpriority="high">
    <span class="lamp" aria-hidden="true"></span>
  </div>

  <div class="wrap">
    <div class="entry-head">
      <div class="entry-no" id="entryNo" aria-hidden="true">—</div>
      <div class="entry-title">
        <h1 id="entryName">Entry</h1>
        <p class="spec" id="entrySpec"></p>
        <p class="meta"><span id="entryCls"></span><span id="entryEra"></span></p>
      </div>
      <div class="entry-actions">
        <button class="pin-lg" type="button" id="pinBtn" data-pin="" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true" class="ros"><circle class="ros-fill" cx="10" cy="8" r="3.1"/><circle cx="10" cy="8" r="5.4"/><path d="M7.8 12.8 6.4 18l3.6-2.4L13.6 18l-1.4-5.2"/></svg>
          <span class="pin-label">Pin a rosette</span>
        </button>
      </div>
    </div>

    <section class="sect" id="card" style="padding-top: clamp(36px, 6vh, 64px);">
      <div class="card-grid">
        <div>
          <div class="jcard" id="jcard"></div>
        </div>
        <div>
          <p class="prose rise" id="citation" style="font-style: italic; color: var(--ivory-dim);"></p>
          <ul class="jnotes rise" id="notes"></ul>
        </div>
      </div>
    </section>

    <section class="sect" id="figures" hidden>
      <div class="sect-head">
        <h2 class="sect-title">In Detail</h2>
        <span class="line" aria-hidden="true"></span>
        <span class="sect-aside">Photographed under the field lamps</span>
      </div>
      <div class="entry-figs" id="figGrid"></div>
    </section>

    <nav class="walk" aria-label="Walk the field">
      <a href="#" id="walkPrev" class="prev"><span class="dir">← Previous entry</span><span class="nm"></span></a>
      <a href="#" id="walkNext" class="next"><span class="dir">Next entry →</span><span class="nm"></span></a>
    </nav>
  </div>
</main>
